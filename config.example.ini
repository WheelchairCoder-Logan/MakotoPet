; ============================================================
;  config.ini 示例 —— 复制为 config.ini 后修改
;  所有项都有默认值，文件不存在也能正常启动。
; ============================================================
[State]
; 服装：0=忍者服 1=日常服 2=校服 3=礼服
Costume=0
; 音量 0~1000
Volume=700
; 缩放倍数（Ctrl+滚轮可调，范围 0.3~3.0）
Zoom=1.0
; 窗口位置，-1 表示自动贴右下角
PosX=-1
PosY=-1
WinW=200
WinH=300

[BGM]
; 背景音乐索引，对应 BGM 目录下的文件顺序
Index=0

[RVC]
; 翻唱变调档位：-1 / 0 / +1
; 实际半音数 = 档位 x RVC_OCTAVE_SEMI（main.cpp 顶部，默认 8）
Octave=0
