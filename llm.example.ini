; ============================================================
;  llm.ini 示例 —— 复制为 llm.ini 后填入你自己的服务
;  ⚠ 这个文件包含密钥，千万不要提交到仓库！
;     仓库里的 .gitignore 已排除 llm.ini，只提交本示例文件。
; ============================================================
[LLM]
; OpenAI 兼容的 chat/completions 端点
ApiUrl=https://your-api-host/v1/chat/completions
; 你的 API Key（sk-...）
ApiKey=YOUR_API_KEY_HERE
Model=your-model-name

; ---- 生成参数 ----
MaxTokens=3000
Temperature=0.9
TopP=0.95
PresencePenalty=0.6
FrequencyPenalty=0.3
EnableThinking=0
UseChatTemplateKwargs=0
UsePenalty=1
UseResponseFormat=1

; ---- 长文本模式（讲故事/讲解时自动放宽上限）----
LongMode=1
LongMaxTokens=4096

; ---- 界面 ----
; 打字机效果总时长（毫秒）
TypewriterTargetMs=6000
; 送进 TTS 的最大字数，超出部分不朗读
TTSMaxChars=200

; ---- GPT-SoVITS 本地 TTS 服务 ----
TtsHost=127.0.0.1
TtsPort=9880
TtsTimeoutMs=45000
TtsVersion=v2Pro
